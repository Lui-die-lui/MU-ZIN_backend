# MU:ZIN 백엔드 자동 배포
# main에 푸시되면: jar 빌드 → (SSH 문 잠깐 열기) → EC2 업로드 → 재시작 → 응답 확인 → (문 닫기)
# 응답 확인에 실패하면 이전 jar로 되돌린다.
name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행

# 배포가 겹치지 않게 한 번에 하나만
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC 로그인용
  contents: read

env:
  AWS_REGION: ap-northeast-2
  HEALTH_URL: https://api.mu-zin.com/

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | head -n 1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "built: $JAR"

      - name: AWS login (OIDC, 키 저장 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Open SSH for this runner only
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-deploy}]"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 보안 그룹 반영까지 몇 초 걸릴 수 있어 재시도
          for i in $(seq 1 10); do
            ssh-keyscan -T 5 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done

      - name: Upload and restart
        run: |
          SSH="ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }}"
          scp -i ~/.ssh/deploy_key "$JAR" ubuntu@${{ secrets.EC2_HOST }}:~/muzin/backend/app.jar.new
          $SSH 'set -e
            cd ~/muzin/backend
            [ -f app.jar ] && cp app.jar app.jar.bak
            mv app.jar.new app.jar
            sudo systemctl restart muzin'

      - name: Health check (실패 시 이전 버전으로 되돌림)
        run: |
          # Spring이 뜨는 동안은 502. 200~499(401 포함)면 정상 응답으로 본다.
          for i in $(seq 1 36); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "try $i: $CODE"
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 500 ]; then
              echo "backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "health check failed, rolling back"
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} 'set -e
            cd ~/muzin/backend
            if [ -f app.jar.bak ]; then mv app.jar.bak app.jar; sudo systemctl restart muzin; fi
            sudo journalctl -u muzin -n 60 --no-pager'
          exit 1

      - name: Close SSH
        if: always()
        run: |
          if [ -n "$RUNNER_IP" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.EC2_SG_ID }}" \
              --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" || true
          fi
          rm -f ~/.ssh/deploy_key
