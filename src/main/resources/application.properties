spring.application.name=mu.zin

# 비밀값은 프로젝트 루트의 .env(git 제외)에서 읽음. 형식은 .env.example 참고
spring.config.import=optional:file:.env[.properties]

# DB
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:3311/muzin_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마는 Flyway(db/migration)가 관리하고, JPA는 엔티티와 일치하는지 검증만 함
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# 기존 로컬 DB(마이그레이션 이력 없음)는 V1, V1.1을 이미 적용된 것으로 간주
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.1

# SQL 로그 (바인딩 값에 개인정보가 찍히므로 기본은 끔. 디버깅 시 .env에서 SQL_LOG_LEVEL=DEBUG)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.pattern.level=%5p [%X{requestId:-}]

# 서비스 주소
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.backend-url=${BACKEND_URL:http://localhost:8080}
oauth2.redirect.success-url=${app.frontend-url}/oauth2/redirect
oauth2.redirect.error-url=${app.frontend-url}/oauth2/redirect

# 샘플(시연용) 계정 레슨을 추천에 보일지 (기본 false = 운영처럼 제외 / 로컬 .env 에서 SHOW_SAMPLE_DATA=true 면 "샘플" 표시와 함께 보임)
app.sample-data.show=${SHOW_SAMPLE_DATA:false}

# JWT (Base64 인코딩된 512bit 이상 키)
jwt.secret=${JWT_SECRET}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend-url}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Naver OAuth2
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.redirect-uri=${app.backend-url}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.scope=name,email,profile_image
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.redirect-uri=${app.backend-url}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image,account_email
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ---------------------------------------------------------------
# AI 레슨 내비게이터 (도구 호출형 AI - 근거는 MU:ZIN DB 에서 조회, 벡터 검색 없음)
# 자세한 설명: docs/ai/lesson-assistant.md
# ---------------------------------------------------------------
# 제공자: stub(기본, 실제 호출·과금 없음) / openai (AI_PROVIDER=openai + OPENAI_API 를 둘 다 설정해야 실제 호출)
app.ai.provider=${AI_PROVIDER:stub}
app.ai.model=${AI_MODEL:gpt-6-luna}
app.ai.openai.api-key=${OPENAI_API:}
app.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.openai.connect-timeout-seconds=10
app.ai.openai.read-timeout-seconds=45
# Responses API 응답을 OpenAI 에 저장하지 않음. 추론 모델의 추론 항목을 다음 요청에 넘기려고 암호화본을 받음
app.ai.openai.store=false
app.ai.openai.include-reasoning-encrypted-content=true

# 이용량
app.ai.weekly-conversation-limit=3
app.ai.max-user-messages=6
app.ai.retention-days=${AI_RETENTION_DAYS:90}
# 샘플(시연용) 계정 레슨은 AI 에 보내지 않음 (app.sample-data.show 와 별개)
app.ai.include-sample-data=false

# 한 번 답변할 때의 상한 (예상 최대 비용 계산에도 씀)
app.ai.max-output-tokens=1500
app.ai.max-tool-rounds=4
app.ai.max-input-chars=24000
app.ai.max-history-messages=10

# 월간 비용 상한 (USD, 전역). 상한에 닿으면 AI 를 호출하지 않고 AI_BUDGET_EXHAUSTED
app.ai.monthly-budget-usd=${AI_MONTHLY_BUDGET_USD:10}

# 모델별 단가 (USD / 100만 토큰) - 가격은 여기 한곳에서만 관리. 바뀌면 이 값(또는 환경 변수)을 고치고 배포
# 단가가 비어 있는 모델은 비용을 계산할 수 없으므로 openai 모드에서 호출하지 않음 (AI_UNAVAILABLE)
app.ai.pricing.models[gpt-6-luna].input-usd-per-mtok=${AI_PRICE_INPUT_USD_PER_MTOK:}
app.ai.pricing.models[gpt-6-luna].cached-input-usd-per-mtok=${AI_PRICE_CACHED_INPUT_USD_PER_MTOK:}
app.ai.pricing.models[gpt-6-luna].output-usd-per-mtok=${AI_PRICE_OUTPUT_USD_PER_MTOK:}
# stub 전용 가상 단가 (실제 과금 없음, 예산 로직 확인용)
app.ai.pricing.models[stub-model].input-usd-per-mtok=0.1
app.ai.pricing.models[stub-model].cached-input-usd-per-mtok=0.01
app.ai.pricing.models[stub-model].output-usd-per-mtok=0.4
